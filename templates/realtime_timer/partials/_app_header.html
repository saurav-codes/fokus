<header class="app-header">
    <nav class="app-header__inner" aria-label="Primary">
        <a href="{% url 'realtime_timer:home' %}" class="app-brand">
            <span class="app-brand__mark">FT</span>
            <span>Focus Timer</span>
        </a>
        <div class="app-nav">
            <a href="{% url 'realtime_timer:main-session-view' %}"
               class="app-nav__link {% if active_page == 'builder' %}is-active{% endif %}">Builder</a>
            <a href="{% url 'realtime_timer:dashboard-view' %}"
               class="app-nav__link {% if active_page == 'dashboard' %}is-active{% endif %}">Dashboard</a>
            {% if active_page == "timer" %}
                <span class="app-nav__link is-active">Live session</span>
            {% endif %}
        </div>
        <div class="app-account">
            {% if user.is_authenticated %}
                <span class="app-account__name">{{ user.username }}</span>
                <a href="{% url 'account_logout' %}" class="app-account__link">Log out</a>
            {% else %}
                <a href="{% url 'account_login' %}?next={{ request.path }}" class="app-account__link">Log in</a>
                <a href="{% url 'account_signup' %}?next={{ request.path }}" class="app-account__link">Sign up</a>
            {% endif %}
        </div>
    </nav>
</header>
