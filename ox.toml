# fokus on the ox1 engine. Everything else is detected from package.json and
# bun.lock: install, the SPA's own build, and the `start` script.
[app]
health = "/healthz"

[build]
# root package.json's start script runs the backend; the SPA still needs its
# own build, so declare it (detection has no `build` script to key on)
commands = ["bun --cwd web run build"]

[storage]
keep = ["data"]

[tools]
bun = "1.3"
