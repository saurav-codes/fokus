# focus-timer on the ox1 engine: Django + daphne (websockets), a scheduler
# worker, redis, SQLite in the data dir, collectstatic served by Caddy.

[app]
start  = "uv run daphne -b 127.0.0.1 -p $PORT src.asgi:application"
health = "/"

[static]
paths = { "/static" = "production_static_files" }

[build]
commands = [
  "uv sync --frozen --no-dev",
  "uv run python manage.py collectstatic --noinput",
]
migrate = "uv run python manage.py migrate --noinput"

[workers]
scheduler = "uv run python manage.py redis_scheduler"

[services]
redis = {}

[storage]
keep = ["db", "logs"]
