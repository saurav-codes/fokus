runtime = "python"
framework = "django"
package_manager = "uv"
port = 8000
environment_file = "/etc/ox/apps/focus-timer.env"
writable_paths = ["/srv/ox/focus-timer/data"]

[[processes]]
name = "web"
command = "uv run daphne -b 127.0.0.1 -p {port} src.asgi:application"
depends_on = ["redis"]

[[processes]]
name = "scheduler"
command = "uv run python manage.py redis_scheduler"
depends_on = ["redis", "web"]

[deploy]
install = ["uv", "sync", "--frozen", "--no-dev"]
build = ["uv", "run", "python", "manage.py", "collectstatic", "--noinput"]
migrate = ["uv", "run", "python", "manage.py", "migrate", "--noinput"]
health_url = "http://127.0.0.1:8000/"

[frontend]
dist = "production_static_files"
api_paths = ["/"]

[[frontend.static]]
prefix = "/static/"
dist = "production_static_files"

[[domains]]
name = "focus.lazyplanner.app"
tls = true
process = "web"
websockets = true
