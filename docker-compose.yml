name: focus-timer

x-app: &app
  build:
    context: .
  image: focus-timer:local
  env_file:
    - .env
  environment:
    DATABASE_PATH: /data/db.sqlite3
    LOG_DIR: /data/logs
    REDIS_URL: redis://redis:6379/0
  volumes:
    - app_data:/data
    - static_data:/app/production_static_files
  restart: unless-stopped

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8010/', headers={'Host': 'focus.lazyplanner.app', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  scheduler:
    <<: *app
    command: ["python", "manage.py", "redis_scheduler"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: focus-timer-nginx:local
    ports:
      - "127.0.0.1::80"
    volumes:
      - static_data:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "--header",
          "Host: focus.lazyplanner.app",
          "--header",
          "X-Forwarded-Proto: https",
          "http://127.0.0.1/",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  redis_data:
  static_data:
